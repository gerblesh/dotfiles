palette = "catppuccin_mocha"
format = """
[░▒▓](base)\
[  ](bg:base fg:sky)\
[](bg:lavender fg:base)\
$directory\
[](fg:lavender bg:surface0)\
$git_branch\
$git_status\
[](fg:surface0 bg:base)\
$nodejs\
$rust\
$golang\
$php\
[](fg:base bg:mantle)\
$time\
[ ](fg:mantle)\
\n$character"""

[status]
disabled = false

[character]
success_symbol = '[╰─❯](bold rosewater) '
error_symbol = '[╰─$status✗](bold red) '

[directory]
style = "fg:base bg:lavender"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:surface0"
format = '[[ $symbol $branch ](fg:blue bg:surface0)]($style)'

[git_status]
style = "bg:surface0"
format = '[[($all_status$ahead_behind )](fg:blue bg:surface0)]($style)'

[nodejs]
symbol = ""
style = "bg:base"
format = '[[ $symbol ($version) ](fg:lavender bg:base)]($style)'

[rust]
symbol = ""
style = "bg:base"
format = '[[ $symbol ($version) ](fg:lavender bg:base)]($style)'

[golang]
symbol = ""
style = "bg:base"
format = '[[ $symbol ($version) ](fg:lavender bg:base)]($style)'

[php]
symbol = ""
style = "bg:base"
format = '[[ $symbol ($version) ](fg:lavender bg:base)]($style)'

[time]
disabled = false
time_format = "%R"                                  # Hour:Minute Format
style = "bg:mantle"
format = '[[  $time ](fg:text bg:mantle)]($style)'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
