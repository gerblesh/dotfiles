# vim:ft=bash

set $text_color #f2f4f8

# set $accent_color #33B1FF
set $accent_color #2a2a2a
set $warning_color #3ddbd9
set $urgent_color #ee5396
set $indicator_color #ff7eb6
set $bg_color #000000
set $unfocused_color #000000

set $font_family SF Mono
set $font_size 14

set $cursor_theme Adwaita
set $cursor_size 32

seat seat0 xcursor_theme $cursor_theme $cursor_size

default_border pixel 4
hide_edge_borders smart

font pango:$font_family Semi-Bold $font_size

client.focused          $accent_color    $accent_color    $text_color   $indicator_color $accent_color
client.focused_inactive $bg_color        $warning_color   $bg_color     $indicator_color $unfocused_color
client.unfocused        $unfocused_color $unfocused_color $text_color   $indicator_color
client.urgent           $bg_color        $urgent_color    $bg_color     $indicator_color $urgent_color
client.placeholder      #000000          #0c0c0c          $text_color   #000000          #333845
client.background       $bg_color

exec_always {
    gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark'
    gsettings set org.gnome.desktop.interface icon-theme 'Adwaita'
    gsettings set org.gnome.desktop.interface text-scaling-factor "1.25"
    gsettings set org.gnome.desktop.interface color-scheme prefer-dark
    gsettings set org.gnome.desktop.interface cursor-theme $cursor_theme
    gsettings set org.gnome.desktop.interface cursor-size $cursor_size
}
